# Forward the site root to http://app:3000 through your authenticating proxy.
services:
  app:
    image: ghcr.io/simonjamain/howlongwillitlast:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      AUTH_MODE: proxy
      IDENTITY_HEADER: ${IDENTITY_HEADER:-x-forwarded-user}
    volumes:
      - measurements:/data
    # No host port: the proxy must strip client identity headers and set its own.
    networks:
      - proxy
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
volumes:
  measurements:
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK:-proxy}
