name: Validate application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
      - name: Build image with OCI metadata
        run: |
          app_version=$(node -p "require('./package.json').version")
          docker build -t howlongwillitlast:ci \
            --build-arg "IMAGE_VERSION=$app_version" \
            --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" .
      - name: Validate Compose files
        env:
          APP_URL: https://howlong.example.com
          OIDC_ISSUER_URL: https://identity.example.com
          OIDC_CLIENT_ID: ci-client
          OIDC_CLIENT_SECRET: ci-placeholder-not-a-secret
          OIDC_EMAIL_DOMAINS: example.com
          PROXY_NETWORK: howlong-ci-proxy
          OAUTH2_PROXY_COOKIE_SECRET: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
        run: |
          docker compose config --quiet
          docker compose -f compose.production.example.yaml config --quiet
          docker network create "$PROXY_NETWORK"
          docker compose -f compose.production.example.yaml run --rm --no-deps oauth2-proxy \
            --config-test --skip-oidc-discovery \
            --login-url=https://identity.example.com/authorize \
            --redeem-url=https://identity.example.com/token \
            --oidc-jwks-url=https://identity.example.com/jwks
      - name: Start and check the production container
        run: |
          docker run -d --name howlong-ci --read-only --tmpfs /tmp -v howlong-ci-data:/data -p 127.0.0.1:3200:3000 howlongwillitlast:ci
          node scripts/container-smoke.mjs
      - name: Check zero-configuration development Compose
        run: |
          docker tag howlongwillitlast:ci howlongwillitlast:local
          docker compose up -d --no-build
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:3000/api/boards
          docker compose down -v
      - name: Image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag howlongwillitlast:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Container logs
        if: always()
        run: docker logs howlong-ci || true
