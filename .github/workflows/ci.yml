name: Validate application
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  packages: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: test-results
      - run: docker build -t howlongwillitlast:ci .
      - name: Start and check the production container
        run: |
          docker run -d --name howlong-ci --read-only --tmpfs /tmp -v howlong-ci-data:/data -p 127.0.0.1:3200:3000 howlongwillitlast:ci
          curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3200/healthz
          node scripts/container-smoke.mjs
      - name: Image tags
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - name: Sign in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the verified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          IMAGE_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            docker tag howlongwillitlast:ci "$tag"
            docker push "$tag"
          done <<< "$IMAGE_TAGS"
      - name: Container logs
        if: always()
        run: docker logs howlong-ci || true
